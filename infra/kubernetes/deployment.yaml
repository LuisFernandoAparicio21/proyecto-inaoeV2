# Kubernetes Deployment - Asistente INAOE
# Manifiesto principal para despliegue en cluster K8s

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inaoe-rag-frontend
  labels:
    app: inaoe-rag
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inaoe-rag
      component: frontend
  template:
    metadata:
      labels:
        app: inaoe-rag
        component: frontend
    spec:
      containers:
      - name: streamlit
        image: ghcr.io/inaoe/rag-frontend:latest
        ports:
        - containerPort: 8501
        env:
        - name: PYTHONPATH
          value: "/app"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
          readOnly: true
        - name: secrets-volume
          mountPath: /app/.streamlit
          readOnly: true
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: inaoe-data-pvc
      - name: secrets-volume
        secret:
          secretName: streamlit-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: inaoe-rag-frontend-svc
spec:
  selector:
    app: inaoe-rag
    component: frontend
  ports:
  - port: 80
    targetPort: 8501
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inaoe-rag-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - asistente.inaoe.mx
    secretName: inaoe-rag-tls
  rules:
  - host: asistente.inaoe.mx
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: inaoe-rag-frontend-svc
            port:
              number: 80

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inaoe-data-pvc
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
